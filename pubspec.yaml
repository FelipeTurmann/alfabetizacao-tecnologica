name: alfabetizacao_tecnologica
description: Plataforma web de inclusão digital para idosos - Alfabetização Tecnológica.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  go_router: ^14.2.0
  shared_preferences: ^2.2.3
  video_player: ^2.9.1
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
